; Mod-provided defaults for MCM Helper's own setting store. The player's edits go to
; Data/MCM/Settings/SHR.ini instead, so this file survives updates.
;
; This store only determines what the controls display, and what their "default" settings are.
; Authority is SHR's co-save (per character) and its TOML profile, and every edit reaches them
; natively through the config.json actions. The menu overwrites these on open with the live
; values, so they matter only for the first frame of the first open; they are kept in step with
; SHR.toml so that frame is not misleading.

[Subject]
fRestingHeartRate=55.0
fMaximumHeartRate=200.0
fFitnessCeiling=55.0
fArrhythmia=1.0

[Profile]
fVolume=1.0
iListenKey=35
bNotifications=0
