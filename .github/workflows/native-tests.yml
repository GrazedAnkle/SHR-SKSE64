name: native tests

on:
  push:
    paths:
      - "cmake/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/native-tests.yml"
  pull_request:
    paths:
      - "cmake/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/native-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-2022
    steps:
      # No submodules: the preset builds the core and its tests without the plugin, so CommonLibSSE is
      # neither checked out nor compiled.
      - uses: actions/checkout@v4

      - name: Select the runner's vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "windows-2022 did not provide VCPKG_INSTALLATION_ROOT"
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Unlike the offline-goldens workflow, this job needs no pinned toolchain: the Catch2 assertions are
      # tolerance-based and hash no floating-point bytes. Only the last command in a cmd step sets the step
      # result, so each one checks errorlevel explicitly.
      - name: Build the plugin-free test executable
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          if errorlevel 1 exit /b 1
          cmake --preset Core-Tests-Release-MSVC
          if errorlevel 1 exit /b 1
          cmake --build build/core-tests-release-msvc --target SHRTests
          if errorlevel 1 exit /b 1

      - name: Run the unit tests
        run: ctest --preset Core-Unit-Tests
