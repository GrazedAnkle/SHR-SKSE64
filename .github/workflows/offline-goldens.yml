name: offline goldens

on:
  push:
    paths:
      - "bindings/**"
      - "cmake/**"
      - "contrib/Distribution/Sound/fx/SHR_HeartBeat/HeartBeat_Shortened.wav"
      - "src/**"
      - "tests/golden/**"
      - "tools/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "requirements.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/offline-goldens.yml"
  pull_request:
    paths:
      - "bindings/**"
      - "cmake/**"
      - "contrib/Distribution/Sound/fx/SHR_HeartBeat/HeartBeat_Shortened.wav"
      - "src/**"
      - "tests/golden/**"
      - "tools/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "requirements.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/offline-goldens.yml"

permissions:
  contents: read
  attestations: read

jobs:
  compiled-core-goldens:
    runs-on: windows-2022
    env:
      LLVM_VERSION: "22.1.6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Select the runner's vcpkg installation
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "windows-2022 did not provide VCPKG_INSTALLATION_ROOT"
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install the golden-capture LLVM toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          gh attestation verify $installer --repo llvm/llvm-project
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer exited with code $($process.ExitCode)"
          }
          $version = & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          if ($version -notmatch "clang version $env:LLVM_VERSION") {
            throw "expected clang $env:LLVM_VERSION, got: $version"
          }

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build the compiled-core binding
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          python tools\build_pybind.py

      - name: Verify compiled-core goldens and run the Python suite
        run: python -m pytest tests --module-dir build/pybind

      # Needs the built binding, so it runs here rather than in the docs workflow. WI-035 folds it in above.
      - name: Verify the immutable coefficient-override contract
        run: python tools/check_coefficient_overrides.py --module-dir build/pybind
